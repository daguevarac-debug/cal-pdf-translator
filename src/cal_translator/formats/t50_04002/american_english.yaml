static_paragraphs:
  measurement_uncertainty:
    sheet: Información
    address: B54
    source: |
      La incertidumbre de medición reportada fue estimada de acuerdo a la Guía para la Expresión de la Incertidumbre de Medida (GUM).

      La incertidumbre expandida  de la medición reportada en la tabla de resultados se establece como la incertidumbre estándar de medición multiplicada con el factor de cobertura k y la probabilidad de cobertura, la cual debe ser aproximada al 95,45% y no menor a este valor.
    target: |
      The reported measurement uncertainty was estimated in accordance with the Guide to the Expression of Uncertainty in Measurement (GUM).

      The expanded measurement uncertainty reported in the results table is obtained by multiplying the standard measurement uncertainty by the coverage factor k. The associated coverage probability is approximately 95.45% and shall not be lower than this value.
  traceability_intro:
    sheet: Información
    address: B64
    source: "La calibración se realiza por comparación con patrones de referencia que mantienen sus medidas trazables al sistema internacional de acuerdo a los certificados descritos en la siguiente tabla:"
    target: "The calibration is performed by comparison with reference standards whose measurements are traceable to the International System of Units (SI), in accordance with the certificates listed in the following table:"
  result_note_1:
    sheet: Información
    address: B77
    source: "1. El sesgo se determino entre el promedio de las lecturas con respecto a la lectura del instrumento patrón."
    target: "1. The bias was determined as the difference between the average of the readings and the reference instrument reading."
  result_note_2:
    sheet: Información
    address: B79
    source: "2. El error máximo permitido esta dada por los valores de exactitud mostrados en el manual del fabricante."
    target: "2. The maximum permissible error is based on the accuracy values specified in the manufacturer's manual."

dynamic_text:
  customer_name:
    source: "SEDT Campo de pruebas Distribución"
    target: "SEDT Distribution Test Field"
  customer_address:
    source: "km 8,5 Autopista Medellín - Costado Sur"
    target: "Medellín Highway, km 8.5 - South Side"
  calibration_method:
    source: "La calibración de medidores de resistencia , se lleva a cabo por método directo o por comparación en los puntos indicados en la EURAMET CG-15 Guía sobre la calibración de multímetros digitales (Guidelines on the Calibration of Digital Multimeters). Versión 3 (02/2015), siguiendo las instrucciones del fabricante que figuran en el manual del usuario. Las medidas de resistencia se realiza a 4 hilos. Antes de la ejecución de las medidas indicadas en el presente certificado, se realizó con éxito si aplica un procedimiento de auto test en el instrumento. Y no se ha realizado ningún procedimiento de ajuste. Los tiempos de estabilidad y de condicionamiento térmico del medidor se realizaron de acuerdo al manual del fabricante del equipo bajo prueba. Los resultados informados en este certificado se refieren a la condición del instrumento en la fecha de calibración y no tienen ninguna implicación con respecto a la estabilidad a largo plazo del instrumento."
    target: |
      The calibration of resistance meters is performed using the direct method or by comparison at the points specified in EURAMET Calibration Guide No. 15, Guidelines on the Calibration of Digital Multimeters, Version 3 (02/2015), following the manufacturer's instructions provided in the user manual.

      Resistance measurements are performed using a four-wire configuration.

      Before the measurements reported in this certificate were performed, the instrument's self-test procedure, when applicable, was successfully completed. No adjustment procedure was performed.

      The meter stabilization and thermal conditioning times were established in accordance with the manufacturer's manual for the equipment under test.

      The results reported in this certificate refer to the condition of the instrument on the calibration date and do not imply anything regarding its long-term stability.
  traceability_equipment:
    "Resistencia de 0,1 mΩ": "0.1 mΩ Resistance Standard"
    "Resistencia de 100 mΩ": "100 mΩ Resistance Standard"
    "Resistencia de 10 mΩ": "10 mΩ Resistance Standard"
    "Resistencia de 1 mΩ": "1 mΩ Resistance Standard"
    "High Power Resistance Substituter": "High Power Resistance Substituter"
  notes:
    "1. Estos resultados corresponden únicamente a la calibración del equipo descrito.": "1. These results apply solely to the calibration of the equipment described."
    "2. El certificado de calibración solo podra circular como documento completo y no podra ser modificado sin nuestra autorización": "2. This calibration certificate may only be circulated as a complete document and may not be modified without our authorization."
    "3. Los certificados sin firma y sello no tendrán validez.": "3. Certificates without a signature and stamp are not valid."
    "4. Este certificado no debe ser reproducido sin aprobación escrita del laboratorio.": "4. This certificate may not be reproduced without the laboratory's written approval."
    "5. Los resultados reportados corresponden al momento y a las condiciones en las cuales se realizaron las pruebas mencionadas": "5. The reported results correspond to the time and conditions under which the referenced tests were performed."
    "6. Para la utilización de este instrumento se debe tener en cuenta los resultados de esta calibración. El usuario determina de acuerdo a la tolerancia establecida para el proceso de medición con el instrumento si le son utiles los resultados obtenidos.": "6. When using this instrument, the results of this calibration must be taken into account. Based on the tolerance established for the measurement process, the user shall determine whether the results obtained are suitable for use with the instrument."
    "7. Servicio prestado en las instalaciones del laboratorio de metrología en Siemens Energy SAS, Tenjo - Cundinamarca.": "7. Service performed at the Siemens Energy SAS metrology laboratory facilities in Tenjo, Cundinamarca."

