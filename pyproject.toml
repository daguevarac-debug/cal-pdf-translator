[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cal-pdf-translator"
version = "0.2.0"
description = "Generate English calibration certificates from controlled Excel templates."
requires-python = ">=3.11"
dependencies = [
  "pywin32>=306; platform_system == 'Windows'",
  "PyYAML>=6.0",
  "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
cal-translator = "cal_translator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cal_translator.formats.t50_04002" = ["*.yaml"]
